[package]
name = "modpack-sync-launcher"
version = "1.0.0"
description = "Modpack Sync Launcher - Distribuir, instalar e sincronizar modpacks de Minecraft"
authors = ["Admin"]
edition = "2021"

[lib]
name = "modpack_sync_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
walkdir = "2.5"
futures = "0.3"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4"] }
anyhow = "1.0"
base64 = "0.22"
